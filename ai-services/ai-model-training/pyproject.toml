[project]
name = "llm-adaptation"
version = "0.1.0"
description = "Adaptação de LLMs — SFT, LoRA/QLoRA, CPT, DPO e GRPO"
authors = [{ name = "GabrielBRS" }]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
llm-adaptation = "llm_adaptation:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_adaptation"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
