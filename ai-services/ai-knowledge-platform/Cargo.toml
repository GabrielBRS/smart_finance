[package]
name = "ai-data-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Data / RAG engine: retrieval, ranking, ingest. IPC ACE1 + HTTP + gRPC."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tonic = "0.14"
tonic-health = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "retrieval"
harness = false

[[bench]]
name = "ranking"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[test]]
name = "retrieval"
path = "tests/integration/retrieval.rs"

[[test]]
name = "ranking"
path = "tests/integration/ranking.rs"

[[test]]
name = "pipeline"
path = "tests/integration/pipeline.rs"
