syntax = "proto3";

package ai.data.v1;

import "common.proto";

// Contrato do data engine. O mesmo serviço atravessa:
//   - IPC  (unix socket, processos locais — caminho entre os 3 projetos)
//   - gRPC (rede / outro host)
//   - HTTP (API externa)
//
// IPC usa MessageType numérico alinhado aos RPCs.
// Health (1/2) é compartilhado com o compute-engine (ACE1).

service DataEngine {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  rpc Rank(RankRequest) returns (RankResponse);
  rpc Rag(RagRequest) returns (RagResponse);
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc Transform(TransformRequest) returns (TransformResponse);
}

message HealthRequest {}

message HealthResponse {
  Status status = 1;
  string version = 2;
  bool ready = 3;
}

message RetrieveRequest {
  string query = 1;
  int32 top_k = 2;
  string mode = 3; // dense | sparse | hybrid
  map<string, string> filter = 4;
}

message RetrieveResponse {
  Status status = 1;
  repeated ScoredChunk hits = 2;
}

message RankRequest {
  string query = 1;
  repeated ScoredChunk hits = 2;
  int32 top_k = 3;
}

message RankResponse {
  Status status = 1;
  repeated ScoredChunk hits = 2;
}

message RagRequest {
  string query = 1;
  int32 top_k = 2;
  int32 max_context_chars = 3;
}

message RagResponse {
  Status status = 1;
  string context = 2;
  repeated ScoredChunk hits = 3;
  repeated string citations = 4;
}

message IngestRequest {
  repeated Document documents = 1;
}

message IngestResponse {
  Status status = 1;
  int32 documents = 2;
  int32 chunks = 3;
}

message TransformRequest {
  string text = 1;
  repeated string ops = 2;
}

message TransformResponse {
  Status status = 1;
  string text = 2;
}
