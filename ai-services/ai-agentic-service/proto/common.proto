syntax = "proto3";

package ai.orchestrator.v1;

enum StatusCode {
  STATUS_OK = 0;
  STATUS_INVALID_ARGUMENT = 1;
  STATUS_NOT_FOUND = 2;
  STATUS_UNAVAILABLE = 3;
  STATUS_UNIMPLEMENTED = 4;
  STATUS_INTERNAL = 5;
}

message Status {
  StatusCode code = 1;
  string message = 2;
}

message Message {
  string role = 1;
  string text = 2;
}
