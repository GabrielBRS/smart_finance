[project]
name = "ai-orchestrator-python"
version = "0.1.0"
description = "Orquestração de agentes — hexagonal, REST + gRPC + IPC ACE1"
authors = [{ name = "GabrielBRS" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "protobuf>=5.29",
]

[project.scripts]
ai-orchestrator-python = "ai_orchestrator:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "grpcio-tools>=1.70",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_orchestrator"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
