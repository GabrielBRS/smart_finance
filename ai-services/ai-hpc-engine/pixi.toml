[workspace]
name = "ai-compute-engine"
version = "0.1.0"
description = "Native Mojo AI compute engine"
authors = ["GabrielBRS"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.0.0,<2"

[tasks]
test = "mojo run -I src tests/test_core.mojo"
run = "mojo run src/main.mojo"
build = { cmd = "mkdir -p build && mojo build src/main.mojo -o build/ai-compute" }
format = "mojo format src tests"
version = "mojo --version"
