[workspace]
name = "vision-inference-engine"
version = "0.1.0"
description = "Native Mojo vision inference engine"
authors = ["GabrielBRS"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.0.0,<2"

[tasks]
test = "mojo run -I src tests/test_core.mojo && mojo run -I src tests/test_nms.mojo && mojo run -I src tests/test_detector.mojo && mojo run -I src tests/test_ipc.mojo && mojo run -I src tests/test_simd.mojo"
run = "mojo run src/main.mojo"
build = { cmd = "mkdir -p build && mojo build src/main.mojo -o build/vision-inference-engine" }
format = "mojo format src tests ../benchmarks"
version = "mojo --version"
bench-preprocess = "mojo run -I src ../benchmarks/preprocessing/bench_preprocess.mojo"
bench-inference = "mojo run -I src ../benchmarks/inference/bench_inference.mojo"
